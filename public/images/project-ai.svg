<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1123" />
      <stop offset="50%" stop-color="#161833" />
      <stop offset="100%" stop-color="#090a18" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="curve-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.0)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-3)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="220" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(60px)" />
  <circle cx="650" cy="140" r="100" fill="#ec4899" opacity="0.08" filter="blur(50px)" />

  <!-- Mockup Window -->
  <rect x="70" y="45" width="660" height="360" rx="16" fill="rgba(22, 24, 51, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Window Header -->
  <rect x="70" y="45" width="660" height="40" rx="16" fill="rgba(15, 17, 35, 0.95)" />
  <circle cx="95" cy="65" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="112" cy="65" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="129" cy="65" r="5" fill="#10b981" opacity="0.8" />
  <rect x="180" y="55" width="440" height="20" rx="6" fill="rgba(255, 255, 255, 0.05)" />
  <text x="400" y="69" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">shaastra.iitm.ac.in/ai-mortality-forecast</text>

  <!-- Competition Banner -->
  <rect x="100" y="105" width="600" height="40" rx="8" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" />
  <text x="120" y="130" fill="#e9d5ff" font-family="sans-serif" font-weight="600" font-size="12">IIT MADRAS SHAASTRA COMPETITION</text>
  <rect x="530" y="114" width="155" height="22" rx="11" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="0.5" />
  <text x="607" y="129" fill="#f472b6" font-family="sans-serif" font-size="10" text-anchor="middle">AI Model Verified</text>

  <!-- Chart Area -->
  <rect x="100" y="160" width="390" height="225" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="120" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Mortality Curve &amp; AI Prediction Trajectory</text>

  <!-- Grid lines inside chart -->
  <line x1="120" y1="230" x2="470" y2="230" stroke="rgba(255, 255, 255, 0.05)" />
  <line x1="120" y1="280" x2="470" y2="280" stroke="rgba(255, 255, 255, 0.05)" />
  <line x1="120" y1="330" x2="470" y2="330" stroke="rgba(255, 255, 255, 0.05)" />

  <!-- Shaded Area Curve -->
  <path d="M 120 330 Q 180 320 220 290 T 300 220 T 360 210 T 420 260 T 470 310 L 470 350 L 120 350 Z" fill="url(#curve-fill)" />
  <!-- Main Prediction Curve -->
  <path d="M 120 330 Q 180 320 220 290 T 300 220 T 360 210 T 420 260 T 470 310" fill="none" stroke="url(#ai-glow)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Actual vs Forecasted dots -->
  <circle cx="300" cy="220" r="5" fill="#38bdf8" />
  <circle cx="360" cy="210" r="5" fill="#ec4899" />
  <circle cx="420" cy="260" r="5" fill="#a855f7" />

  <!-- Info Side Panel -->
  <rect x="505" y="160" width="195" height="225" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="520" y="188" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">MODEL METRICS</text>
  
  <text x="520" y="215" fill="#94a3b8" font-family="sans-serif" font-size="10">Target Region</text>
  <text x="520" y="232" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="13">India States Cohort</text>

  <text x="520" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Evaluation Metric</text>
  <text x="520" y="277" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="13">Low RMSE / High R²</text>

  <text x="520" y="305" fill="#94a3b8" font-family="sans-serif" font-size="10">Algorithms</text>
  <text x="520" y="322" fill="#e2e8f0" font-family="sans-serif" font-size="11">Time-series Regression</text>
  <text x="520" y="337" fill="#e2e8f0" font-family="sans-serif" font-size="11">Epidemic Curve Fitting</text>

  <rect x="520" y="355" width="165" height="20" rx="4" fill="rgba(255, 255, 255, 0.05)" />
  <text x="602" y="369" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Python • Pandas • Scikit</text>
</svg>
