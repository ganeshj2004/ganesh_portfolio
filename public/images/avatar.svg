<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e27" />
      <stop offset="50%" stop-color="#061f1a" />
      <stop offset="100%" stop-color="#020e0c" />
    </linearGradient>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="avatar-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background circle with outer border glow -->
  <circle cx="200" cy="200" r="190" fill="url(#avatar-bg)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accent-stroke)" stroke-width="2.5" opacity="0.85" />
  <circle cx="200" cy="180" r="140" fill="url(#avatar-glow)" />

  <!-- Glass Specular Highlight Curve -->
  <path d="M 50 140 A 170 170 0 0 1 350 140 A 185 140 0 0 0 50 140 Z" fill="url(#glass-specular)" />

  <!-- Code brackets in background with mint glow -->
  <text x="65" y="160" fill="#2dd4bf" opacity="0.3" font-family="monospace" font-size="64" font-weight="bold">&lt;</text>
  <text x="315" y="240" fill="#10b981" opacity="0.3" font-family="monospace" font-size="64" font-weight="bold">&gt;/</text>

  <!-- Developer Silhouette / Illustration -->
  <g>
    <!-- Head -->
    <circle cx="200" cy="145" r="52" fill="#e2f5ee" />
    <!-- Hair / Modern Style -->
    <path d="M150 140 C150 95, 250 95, 250 140 C240 125, 220 120, 200 120 C180 120, 160 125, 150 140 Z" fill="#082923" />
    <!-- Glasses with Mint Rims -->
    <rect x="165" y="140" width="30" height="18" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <rect x="205" y="140" width="30" height="18" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <line x1="195" y1="148" x2="205" y2="148" stroke="#2dd4bf" stroke-width="3" />

    <!-- Shoulders & Torso -->
    <path d="M110 320 C110 240, 150 220, 200 220 C250 220, 290 240, 290 320 Z" fill="#0c3b32" />
    <!-- Hoodie V-neck collar -->
    <polygon points="180,225 220,225 200,270" fill="#051c17" />
    <!-- Monogram badge on chest -->
    <circle cx="200" cy="295" r="14" fill="#06241e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="200" y="300" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">G</text>
  </g>

  <!-- Glowing status dot: Available for work -->
  <circle cx="280" cy="270" r="10" fill="#10b981" />
  <circle cx="280" cy="270" r="15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="12;18;12" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>
