<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-1)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="240" cy="180" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />
  <circle cx="620" cy="280" r="120" fill="#8b5cf6" opacity="0.1" filter="blur(40px)" />

  <!-- Mockup Window -->
  <rect x="70" y="45" width="660" height="360" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Window Header -->
  <rect x="70" y="45" width="660" height="40" rx="16" fill="rgba(15, 23, 42, 0.6)" />
  <circle cx="95" cy="65" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="112" cy="65" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="129" cy="65" r="5" fill="#10b981" opacity="0.8" />
  <rect x="180" y="55" width="440" height="20" rx="6" fill="rgba(255, 255, 255, 0.05)" />
  <text x="400" y="69" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">party-decor-booking.app/dashboard</text>

  <!-- Dashboard Content Preview -->
  <!-- Sidebar -->
  <rect x="90" y="105" width="140" height="280" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
  <rect x="105" y="125" width="110" height="12" rx="4" fill="#38bdf8" opacity="0.7" />
  <rect x="105" y="150" width="90" height="10" rx="3" fill="#64748b" opacity="0.5" />
  <rect x="105" y="170" width="100" height="10" rx="3" fill="#64748b" opacity="0.5" />
  <rect x="105" y="190" width="80" height="10" rx="3" fill="#64748b" opacity="0.5" />
  <rect x="105" y="210" width="95" height="10" rx="3" fill="#64748b" opacity="0.5" />

  <!-- Main Content Cards -->
  <!-- Stats row -->
  <rect x="250" y="105" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(56, 189, 248, 0.2)" />
  <text x="265" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Bookings</text>
  <text x="265" y="158" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">148</text>

  <rect x="405" y="105" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(139, 92, 246, 0.2)" />
  <text x="420" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Status</text>
  <text x="420" y="158" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="18">Confirmed</text>

  <rect x="560" y="105" width="150" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="575" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">JWT Session</text>
  <text x="575" y="158" fill="#60a5fa" font-family="monospace" font-size="13">ACTIVE_TOKEN</text>

  <!-- Booking List Table Preview -->
  <rect x="250" y="190" width="460" height="195" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
  <!-- Table Header -->
  <rect x="250" y="190" width="460" height="32" rx="8" fill="rgba(255, 255, 255, 0.04)" />
  <text x="270" y="211" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CLIENT EVENT</text>
  <text x="430" y="211" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">DATE</text>
  <text x="550" y="211" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">STATUS</text>
  <text x="650" y="211" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ACTION</text>

  <!-- Row 1 -->
  <line x1="250" y1="245" x2="710" y2="245" stroke="rgba(255, 255, 255, 0.04)" />
  <circle cx="275" cy="235" r="4" fill="#38bdf8" />
  <text x="290" y="238" fill="#e2e8f0" font-family="sans-serif" font-size="11">Birthday Gala Decor</text>
  <text x="430" y="238" fill="#94a3b8" font-family="sans-serif" font-size="11">Nov 18, 2025</text>
  <rect x="545" y="226" width="68" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.5" />
  <text x="579" y="239" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">CONFIRMED</text>

  <!-- Row 2 -->
  <line x1="250" y1="280" x2="710" y2="280" stroke="rgba(255, 255, 255, 0.04)" />
  <circle cx="275" cy="265" r="4" fill="#a855f7" />
  <text x="290" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="11">Corporate Anniversary</text>
  <text x="430" y="268" fill="#94a3b8" font-family="sans-serif" font-size="11">Nov 22, 2025</text>
  <rect x="545" y="256" width="68" height="18" rx="9" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="0.5" />
  <text x="579" y="269" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">PROCESSING</text>

  <!-- Row 3 -->
  <line x1="250" y1="315" x2="710" y2="315" stroke="rgba(255, 255, 255, 0.04)" />
  <circle cx="275" cy="298" r="4" fill="#f59e0b" />
  <text x="290" y="301" fill="#e2e8f0" font-family="sans-serif" font-size="11">Grand Reception Stage</text>
  <text x="430" y="301" fill="#94a3b8" font-family="sans-serif" font-size="11">Dec 02, 2025</text>
  <rect x="545" y="289" width="68" height="18" rx="9" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="0.5" />
  <text x="579" y="302" fill="#fbbf24" font-family="sans-serif" font-size="9" text-anchor="middle">PENDING</text>

  <!-- Technology Badges at Bottom -->
  <rect x="250" y="345" width="75" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" />
  <text x="287" y="361" fill="#93c5fd" font-family="sans-serif" font-size="10" text-anchor="middle">React.js</text>

  <rect x="335" y="345" width="75" height="24" rx="12" fill="rgba(34, 197, 94, 0.2)" stroke="rgba(34, 197, 94, 0.4)" />
  <text x="372" y="361" fill="#86efac" font-family="sans-serif" font-size="10" text-anchor="middle">Node.js</text>

  <rect x="420" y="345" width="75" height="24" rx="12" fill="rgba(14, 165, 233, 0.2)" stroke="rgba(14, 165, 233, 0.4)" />
  <text x="457" y="361" fill="#7dd3fc" font-family="sans-serif" font-size="10" text-anchor="middle">MySQL</text>

  <rect x="505" y="345" width="65" height="24" rx="12" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)" />
  <text x="537" y="361" fill="#d8b4fe" font-family="sans-serif" font-size="10" text-anchor="middle">JWT</text>
</svg>
