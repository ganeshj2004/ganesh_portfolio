<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c16" />
    </linearGradient>
    <linearGradient id="teal-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-2)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="500" cy="180" r="160" fill="#06b6d4" opacity="0.1" filter="blur(50px)" />
  <circle cx="200" cy="300" r="130" fill="#6366f1" opacity="0.1" filter="blur(50px)" />

  <!-- Mockup Window -->
  <rect x="70" y="45" width="660" height="360" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Window Header -->
  <rect x="70" y="45" width="660" height="40" rx="16" fill="rgba(15, 23, 42, 0.95)" />
  <circle cx="95" cy="65" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="112" cy="65" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="129" cy="65" r="5" fill="#10b981" opacity="0.8" />
  <rect x="180" y="55" width="440" height="20" rx="6" fill="rgba(255, 255, 255, 0.05)" />
  <text x="400" y="69" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">portal.exam-results.edu/auth/rbac</text>

  <!-- Content -->
  <!-- Top bar status -->
  <rect x="100" y="105" width="600" height="46" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.25)" />
  <text x="120" y="133" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="13">SECURE PORTAL ACTIVE</text>
  <text x="320" y="133" fill="#94a3b8" font-family="sans-serif" font-size="12">Role: System Administrator</text>
  <rect x="560" y="117" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.5" />
  <text x="620" y="132" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">PostgreSQL Sync</text>

  <!-- 4 Roles Badge Container -->
  <rect x="100" y="165" width="600" height="55" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="120" y="197" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">RBAC TIERS:</text>

  <rect x="210" y="180" width="105" height="26" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" />
  <text x="262" y="197" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="middle">1. Admin</text>

  <rect x="330" y="180" width="105" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" />
  <text x="382" y="197" fill="#7dd3fc" font-family="sans-serif" font-size="11" text-anchor="middle">2. Faculty</text>

  <rect x="450" y="180" width="105" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
  <text x="502" y="197" fill="#fcd34d" font-family="sans-serif" font-size="11" text-anchor="middle">3. Evaluator</text>

  <rect x="570" y="180" width="105" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
  <text x="622" y="197" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">4. Student</text>

  <!-- Metric Panels -->
  <rect x="100" y="235" width="285" height="150" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="120" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">Throughput Verification</text>
  <text x="120" y="295" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">1,000+ Students</text>
  <text x="120" y="325" fill="#34d399" font-family="sans-serif" font-size="12">● Zero concurrent bottleneck</text>
  <text x="120" y="350" fill="#64748b" font-family="sans-serif" font-size="11">Fast query response &lt; 85ms</text>

  <rect x="415" y="235" width="285" height="150" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="435" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">Publishing Pipeline</text>
  <text x="435" y="290" fill="#e2e8f0" font-family="monospace" font-size="11">POST /api/v1/results/batch-upload</text>
  <rect x="435" y="305" width="245" height="8" rx="4" fill="rgba(255, 255, 255, 0.1)" />
  <rect x="435" y="305" width="220" height="8" rx="4" fill="#06b6d4" />
  <text x="435" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11">Batch Status: 100% Processed &amp; Verified</text>
  <text x="435" y="355" fill="#38bdf8" font-family="sans-serif" font-size="11">Stack: Python • PostgreSQL • Web Portal</text>
</svg>
